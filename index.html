const ALBUMS = ["Introduction", "Progressive", "Variety", "TWELVE", "Mrs. GREEN APPLE", "ENSEMBLE", "Attitude", "5", "Unity", "ANTENNA", "The White Lounge", "10", "POPS", "Speaking", "サママ・フェスティバル！", "In the Morning", "どこかで日は昇る", "WanteD! WanteD!", "Love me, Love you", "青と夏", "僕のこと", "ロマンチシズム", "Soranji", "Digital"];
const MOODS = ["夜・しっとり", "やさしい", "エモ・壮大", "明るい・爽やか", "爆上がり", "ダーク・尖り", "グルーヴ", "変化球"];
const PERIODS = {"2014–2016": [2014, 2015, 2016], "2017–2019": [2017, 2018, 2019], "2020–2022": [2020, 2021, 2022], "2023–2024": [2023, 2024], "2025–2026": [2025, 2026]};

let mode = "all", selected = null, lastId = null, draws = 0;
const $ = (id) => document.getElementById(id);
const els = {songTitle:$("songTitle"),songMeta:$("songMeta"),songNote:$("songNote"),modePill:$("modePill"),musicBtn:$("musicBtn"),chips:$("chips"),filterLabel:$("filterLabel"),poolCount:$("poolCount"),drawCount:$("drawCount"),variants:$("variantsToggle"),upcoming:$("upcomingToggle")};

function randomIndex(max){
  if (max <= 1) return 0;
  if (window.crypto?.getRandomValues) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % max; }
  return Math.floor(Math.random()*max);
}
function periodMatch(year,label){return (PERIODS[label]||[]).includes(year)}
function pool(){
  let p = SONGS.filter(s => els.variants.checked || !s.variant).filter(s => els.upcoming.checked || s.status !== "upcoming");
  if(mode === "mood" && selected) p = p.filter(s => s.moods.includes(selected));
  if(mode === "album" && selected) p = p.filter(s => s.albums.includes(selected));
  if(mode === "period" && selected) p = p.filter(s => periodMatch(s.year,selected));
  return p;
}
function musicSearchUrl(song){
  const clean = song.title.replace(/\s*\([^)]*(Version|ver\.|Mix|Remix)[^)]*\)\s*/gi, " ").trim();
  return "https://music.apple.com/jp/search?term=" + encodeURIComponent("Mrs. GREEN APPLE " + clean);
}
function drawSong(){
  const p = pool();
  if(!p.length){els.songTitle.textContent="該当曲なし";els.songMeta.textContent="フィルターを変えてみて";els.songNote.textContent="";els.musicBtn.classList.add("hidden");return}
  let s = p[randomIndex(p.length)], tries=0;
  while(p.length>1 && s.id===lastId && tries++<20) s=p[randomIndex(p.length)];
  lastId=s.id;draws++;
  els.songTitle.classList.remove("pop"); void els.songTitle.offsetWidth; els.songTitle.textContent=s.title; els.songTitle.classList.add("pop");
  els.songMeta.textContent=`${s.year} • ${s.moods.join(" / ")}`;
  els.songNote.textContent=s.note || (s.variant ? "別バージョン" : "");
  els.musicBtn.classList.remove("hidden");
  if(s.status === "upcoming"){els.musicBtn.removeAttribute("href");els.musicBtn.textContent=" Music — 配信予定";els.musicBtn.style.opacity=".52";els.musicBtn.style.pointerEvents="none"}
  else{els.musicBtn.href=musicSearchUrl(s);els.musicBtn.textContent=" Musicで聴く";els.musicBtn.style.opacity="1";els.musicBtn.style.pointerEvents="auto"}
  els.drawCount.textContent=`${draws}回ガチャ`; updateCount(); if(navigator.vibrate) navigator.vibrate(15);
}
function optionsForMode(){if(mode==="mood")return MOODS;if(mode==="album")return ALBUMS.filter(a=>SONGS.some(s=>s.albums.includes(a)));if(mode==="period")return Object.keys(PERIODS);return[]}
function renderChips(){
  els.chips.replaceChildren(); const opts=optionsForMode();
  if(mode==="all"){selected=null;els.filterLabel.textContent="全曲ガチャ"}
  else{els.filterLabel.textContent=mode==="mood"?"曲調を選択":mode==="album"?"作品を選択":"年代を選択";if(!selected||!opts.includes(selected))selected=opts[0]||null;
    for(const o of opts){const b=document.createElement("button");b.type="button";b.className="chip"+(o===selected?" active":"");b.textContent=o;b.addEventListener("click",()=>{selected=o;renderChips();});els.chips.appendChild(b)}
  } updateBadge();updateCount();
}
function updateBadge(){els.modePill.textContent=mode==="all"?"🎲 全曲からランダム":mode==="mood"?"🎧 "+selected:mode==="album"?"💿 "+selected:"🗓 "+selected}
function updateCount(){els.poolCount.textContent=`対象 ${pool().length}曲 / 収録 ${SONGS.length}音源`}

document.addEventListener("DOMContentLoaded",()=>{
  $("drawBtn").addEventListener("click",drawSong);
  document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");mode=t.dataset.mode;selected=null;renderChips();}));
  els.variants.addEventListener("change",updateCount);els.upcoming.addEventListener("change",updateCount);
  const dlg=$("helpDialog");$("installHelp").addEventListener("click",()=>dlg.showModal());$("closeHelp").addEventListener("click",()=>dlg.close());
  renderChips();
});
